  <div id="status" class="status">Connected</div>
  <script>
    const firebaseConfig={apiKey:"AIzaSyAoYsT80oNc505TgobYwTv0T7YfUF_fWRs",authDomain:"cup-and-go-pos-e0ad1.firebaseapp.com",databaseURL:"https://cup-and-go-pos-e0ad1-default-rtdb.firebaseio.com",projectId:"cup-and-go-pos-e0ad1"};
    firebase.initializeApp(firebaseConfig);const db=firebase.database();
    const FALLBACK_LOGO="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fff'/%3E%3Cpath d='M24 37h48v25a18 18 0 0 1-18 18H42a18 18 0 0 1-18-18V37zm48 7h7a11 11 0 0 1 0 22h-8' fill='none' stroke='%236b1b23' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M37 25c-7-8 7-10 0-18M55 25c-7-8 7-10 0-18' fill='none' stroke='%23d9a927' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E";
    const SETTINGS_CACHE='cng_full_menu_settings_v1',PRODUCTS_CACHE='cng_full_menu_products_v1';
    let cachedProducts=null,cachedSettings={};try{const c=JSON.parse(localStorage.getItem(PRODUCTS_CACHE)||'null');if(Array.isArray(c))cachedProducts=c}catch(e){}try{cachedSettings=JSON.parse(localStorage.getItem(SETTINGS_CACHE)||'{}')||{}}catch(e){cachedSettings={}}
    let products=cachedProducts||[],productsLoaded=Array.isArray(cachedProducts),settings=cachedSettings,adminCategories=Array.isArray(cachedSettings.categories)?cachedSettings.categories:[],activeCategory='all',isArabic=localStorage.getItem('cng_lang')==='ar',slides=[],slideIndex=0,sliderTimer=null,introStartedAt=Date.now(),introHidden=false;
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const catAr={Coffee:'قهوة',Sweet:'حلويات','Cold Drink':'مشروبات باردة','Cold Drinks':'مشروبات باردة',Tea:'شاي',Matcha:'ماتشا',Breakfast:'فطور',Dessert:'حلويات'};
    const text={en:{menu:'Full Menu',sub:'Tap any picture to view it full size',all:'All Items',loading:'Loading menu…',empty:'No menu items found.',offline:'Connection unavailable — retrying…',lang:'عربي'},ar:{menu:'القائمة الكاملة',sub:'اضغط على أي صورة لعرضها بالحجم الكامل',all:'جميع الأصناف',loading:'جاري تحميل القائمة…',empty:'لا توجد أصناف في القائمة.',offline:'الاتصال غير متاح — جاري إعادة المحاولة…',lang:'English'}};
    function nameOf(p){return isArabic?(p.nameAr||p.name||'صنف'):(p.name||p.nameAr||'Item')}
    function descOf(p){return isArabic?(p.descriptionAr||p.descriptionEn||p.description||''):(p.descriptionEn||p.description||p.descriptionAr||'')}
    function categoryName(c){return isArabic?(catAr[c]||c):c}
    function updateClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});const h=d.getHours();document.getElementById('greeting').textContent=isArabic?(h<12?'صباح الخير ☀️':h<17?'مساء الخير 🌤️':'مساء النور 🌙'):(h<12?'Good Morning ☀️':h<17?'Good Afternoon 🌤️':h<21?'Good Evening 🌙':'Have a great night ☕')}
    function applyLanguage(){const t=isArabic?text.ar:text.en;document.documentElement.lang=isArabic?'ar':'en';document.documentElement.dir=isArabic?'rtl':'ltr';document.getElementById('langBtn').textContent=t.lang;document.getElementById('menuTitle').textContent=t.menu;document.getElementById('menuSub').textContent=t.sub;document.getElementById('shopName').textContent=isArabic?'كوب آند جو':(settings.shopName||'Cup And Go');updateClock();renderCategories();renderMenu()}
    function toggleLanguage(){isArabic=!isArabic;localStorage.setItem('cng_lang',isArabic?'ar':'en');applyLanguage()}
    function showStatus(message){const el=document.getElementById('status');el.textContent=message;el.classList.add('show');clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>el.classList.remove('show'),2200)}
    function hideMenuIntro(){if(introHidden)return;const wait=Math.max(0,900-(Date.now()-introStartedAt));setTimeout(()=>{if(introHidden)return;introHidden=true;const el=document.getElementById('menuIntro');if(!el)return;el.classList.add('hide');setTimeout(()=>el.remove(),540)},wait)}
    function initSlider(images){slides=(images||[]).filter(Boolean).slice(0,3);const box=document.getElementById('slider'),track=document.getElementById('sliderTrack'),dots=document.getElementById('sliderDots');clearInterval(sliderTimer);slideIndex=0;if(!slides.length){box.style.display='none';return}box.style.display='block';track.innerHTML=slides.map((src,i)=>`<div class="slide"><img src="${esc(src)}" alt="Offer ${i+1}" loading="${i?'lazy':'eager'}" decoding="async"></div>`).join('');dots.innerHTML=slides.map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join('');track.style.transform='translateX(0)';if(slides.length>1)sliderTimer=setInterval(()=>{slideIndex=(slideIndex+1)%slides.length;track.style.transform=`translateX(${(isArabic?1:-1)*slideIndex*100}%)`;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===slideIndex))},3000)}
    function productCategory(p){return String((p&&p.category)||'Other').trim()||'Other'}
    function allMenuCategories(items=products){return [...new Set([...(adminCategories||[]),...items.map(productCategory)].filter(Boolean))]}
    function renderCategories(){const cats=allMenuCategories();const box=document.getElementById('categories');box.innerHTML=`<button class="cat-btn ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">${isArabic?text.ar.all:text.en.all}</button>`+cats.map(c=>`<button class="cat-btn ${activeCategory===c?'active':''}" onclick="setCategory(decodeURIComponent('${encodeURIComponent(c)}'))">${esc(categoryName(c))}</button>`).join('')}
    function setCategory(c){activeCategory=c;renderCategories();renderMenu()}
    function card(p){const id=encodeURIComponent(String(p.id??p.name??'')),name=nameOf(p),desc=descOf(p),hasImage=p.icon&&String(p.icon).length>15,sold=!!(p.customerUnavailable||p.soldOut);return `<article class="item-card"><button class="item-image-btn" type="button" onclick="openPreview('${id}')" aria-label="${esc(name)}">${hasImage?`<img class="item-image" src="${esc(p.icon)}" alt="${esc(name)}" loading="lazy" decoding="async">`:`<span class="item-fallback">${esc(p.icon||'☕')}</span>`}<span class="zoom-badge">⌕</span></button><div class="item-info"><div class="item-name">${esc(name)}</div>${desc?`<div class="item-desc">${esc(desc)}</div>`:''}<div class="item-bottom"><div class="item-price">${Number(p.price||0).toFixed(2)} ﷼</div>${sold?`<span class="badge sold">${isArabic?'نفد مؤقتاً':'SOLD OUT'}</span>`:(p.isPopular?`<span class="badge">${isArabic?'الأكثر طلباً':'POPULAR'}</span>`:'')}</div></div></article>`}
    function renderMenu(){const grid=document.getElementById('menuGrid');if(!productsLoaded){grid.innerHTML='<div class="menu-skeleton" aria-label="Loading menu"><div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div></div>';return}if(!products.length){grid.innerHTML=`<div class="empty">${isArabic?text.ar.empty:text.en.empty}</div>`;return}if(activeCategory!=='all'){const list=products.filter(p=>productCategory(p)===activeCategory);grid.innerHTML=list.length?list.map(card).join(''):`<div class="empty">${isArabic?text.ar.empty:text.en.empty}</div>`;return}const cats=allMenuCategories();let html='';cats.forEach(c=>{const list=products.filter(p=>productCategory(p)===c);if(list.length)html+=`<h3 class="category-title">${esc(categoryName(c))}</h3>${list.map(card).join('')}`});grid.innerHTML=html||`<div class="empty">${isArabic?text.ar.empty:text.en.empty}</div>`}
    function openPreview(encoded){let id='';try{id=decodeURIComponent(encoded)}catch(e){id=encoded}const p=products.find(x=>String(x.id??x.name??'')===id);if(!p)return;const hasImage=p.icon&&String(p.icon).length>15;document.getElementById('previewImageWrap').innerHTML=hasImage?`<img class="preview-img" src="${esc(p.icon)}" alt="${esc(nameOf(p))}">`:`<span class="item-fallback">${esc(p.icon||'☕')}</span>`;document.getElementById('previewName').textContent=nameOf(p);document.getElementById('previewDesc').textContent=descOf(p);document.getElementById('previewPrice').textContent=`${Number(p.price||0).toFixed(2)} ﷼`;document.getElementById('previewModal').classList.add('show');document.body.style.overflow='hidden'}
    function closePreview(){document.getElementById('previewModal').classList.remove('show');document.body.style.overflow=''}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});
    db.ref('/settings').on('value',snap=>{settings=snap.val()||{};try{localStorage.setItem(SETTINGS_CACHE,JSON.stringify(settings))}catch(e){}document.getElementById('shopLogo').src=settings.shopLogo||FALLBACK_LOGO;const introName=document.getElementById('menuIntroName');if(introName)introName.textContent=settings.shopName||'Cup And Go';adminCategories=Array.isArray(settings.categories)?settings.categories:[];const banners=Array.isArray(settings.promoBanners)?settings.promoBanners:(settings.offerPosterImage?[settings.offerPosterImage]:[]);initSlider(banners);applyLanguage()},()=>showStatus(isArabic?text.ar.offline:text.en.offline));
    db.ref('/ledMatrix').on('value',snap=>{const led=snap.val()||{};const el=document.getElementById('ledText');el.textContent=led.text||'☕ Welcome to Cup And Go ☕';el.style.color=led.color||'#ffe855';el.style.fontFamily=led.font||"'Courier New', monospace";el.style.animationDuration=`${Math.min(Math.max(Number(led.speed)||20,5),60)}s`});
    db.ref('/products').on('value',snap=>{const data=snap.val();products=data?Object.values(data).filter(Boolean):[];productsLoaded=true;try{localStorage.setItem(PRODUCTS_CACHE,JSON.stringify(products))}catch(e){}renderCategories();renderMenu();hideMenuIntro()},()=>{showStatus(isArabic?text.ar.offline:text.en.offline);setTimeout(hideMenuIntro,500)});
    document.getElementById('shopLogo').src=settings.shopLogo||FALLBACK_LOGO;document.getElementById('menuIntroName').textContent=settings.shopName||'Cup And Go';const cachedBanners=Array.isArray(settings.promoBanners)?settings.promoBanners:(settings.offerPosterImage?[settings.offerPosterImage]:[]);initSlider(cachedBanners);updateClock();setInterval(updateClock,1000);applyLanguage();if(productsLoaded)hideMenuIntro();setTimeout(hideMenuIntro,3200);
  </script>
<style id="cng-fast-menu-images-style">
.cng-img-loading{position:relative;overflow:hidden;background:#efe8e1!important}.cng-img-loading::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.68) 46%,transparent 64%);transform:translateX(-110%);animation:cngImageShimmer 1.15s ease-in-out infinite}.cng-img-loaded::after{display:none}@keyframes cngImageShimmer{to{transform:translateX(110%)}}
</style>
<script id="cng-fast-menu-images-script">
(function(){
  const selector='img.admin-product-img,img.item-img,img.item-image';
  function prepare(){
    document.querySelectorAll(selector).forEach((img,index)=>{
      if(img.dataset.cngPrepared)return;img.dataset.cngPrepared='1';
      const first=index<6;img.loading=first?'eager':'lazy';img.decoding='async';img.setAttribute('fetchpriority',first?'high':'low');
      const box=img.parentElement;if(box){box.classList.add('cng-img-loading');const done=()=>{box.classList.remove('cng-img-loading');box.classList.add('cng-img-loaded')};if(img.complete)done();else{img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true})}}
    });
  }
  document.addEventListener('DOMContentLoaded',()=>{prepare();new MutationObserver(prepare).observe(document.body,{childList:true,subtree:true})});
})();
</script>
