    .merch-tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border:1px solid rgba(255,255,255,.55);border-radius:999px;color:#fff;font-size:8px;font-weight:950;letter-spacing:.04em;box-shadow:0 5px 14px rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .merch-tag.new{background:linear-gradient(135deg,rgba(32,151,91,.95),rgba(48,187,112,.92))}
    .merch-tag.offer{background:linear-gradient(135deg,rgba(224,91,17,.96),rgba(255,145,31,.94))}
    .merch-tag.popular{background:linear-gradient(135deg,rgba(164,96,0,.96),rgba(209,125,0,.94));box-shadow:0 5px 16px rgba(209,125,0,.28)}
    .preview-rating{margin-top:15px;padding:13px 14px;border:1px solid rgba(209,125,0,.18);border-radius:17px;background:#fff9eb}
    .preview-rating-title{margin-bottom:8px;color:#8c5a0b;font-size:11px;font-weight:900}
    .rating-buttons{display:flex;align-items:center;gap:5px;direction:ltr}
    .rating-button{width:42px;height:42px;padding:0;border:0;border-radius:12px;background:transparent;color:#d7c8aa;font-size:29px;line-height:1;cursor:pointer;transition:transform .16s ease,color .16s ease,background .16s ease}
    .rating-button.active,.rating-button:hover{color:#d17d00;background:rgba(209,125,0,.08);text-shadow:0 2px 10px rgba(209,125,0,.23)}
    .rating-button:active{transform:scale(.9)}
    .shop-logo-frame{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;overflow:hidden;border:2px solid #fff;outline:1px solid rgba(239,200,76,.75);border-radius:15px;background:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 25px rgba(0,0,0,.16)}
    .shop-logo-frame .shop-logo{width:116%!important;height:116%!important;max-width:none!important;flex-basis:auto!important;border:0!important;outline:0!important;border-radius:0!important;box-shadow:none!important;object-fit:cover!important;object-position:center!important}
    @keyframes premiumSweep{0%,72%,100%{transform:translateX(-130%)}86%{transform:translateX(130%)}}
    @media(prefers-reduced-motion:reduce){.item-card.premium-item::after{animation:none}.rating-button{transition:none}}
    .shop-logo{
      width:50px!important;
      height:50px!important;
      flex-basis:50px!important;
      border-width:2px!important;
      border-radius:15px!important;
    }
    .shop-name{
      font-size:clamp(20px,5.7vw,27px)!important;
      line-height:1!important;
      letter-spacing:-.25px!important;
    }
    .greeting{margin-top:5px!important;font-size:10px!important;line-height:1.1!important}
    .lang-btn{
      min-width:55px!important;
      width:55px!important;
      height:36px!important;
      border-radius:12px!important;
      padding:0 6px!important;
      font-size:10px!important;
    }
    .clock{right:16px!important;bottom:8px!important;font-size:7px!important}
    [dir="rtl"] .clock{right:auto!important;left:16px!important}
    .content{padding-top:20px!important}
    .signboard{
      height:60px!important;
      min-height:60px!important;
      margin-bottom:15px!important;
      border-radius:21px!important;
    }
    .signboard::before{background-size:11px 11px!important}
    .signboard::after{right:13px!important;bottom:5px!important;font-size:6px!important;letter-spacing:1.4px!important}
    [dir="rtl"] .signboard::after{right:auto!important;left:13px!important}
    .led-window{inset:4px 0 9px!important}
    .led-text{font-size:22px!important;letter-spacing:4px!important}
    @media(max-width:430px){
      :root{--cng-fixed-header-h:max(94px,calc(81px + var(--safe-top)))}
      .header{min-height:94px!important;padding-left:12px!important;padding-right:12px!important}
      .categories{top:auto!important}
      .shop-logo-frame{width:48px;height:48px;flex-basis:48px;border-radius:15px}
      .shop-logo{width:48px!important;height:48px!important;flex-basis:48px!important}
      .shop-name{font-size:21px!important}
      .lang-btn{min-width:52px!important;width:52px!important;height:34px!important}
      .content{padding-top:18px!important}
      .signboard{height:56px!important;min-height:56px!important;border-radius:19px!important}
      .led-text{font-size:21px!important;letter-spacing:3px!important}
    }
    @media(max-width:340px){
      .header{gap:7px!important}
      .shop-logo-frame{width:43px;height:43px;flex-basis:43px;border-radius:13px}
      .shop-logo{width:43px!important;height:43px!important;flex-basis:43px!important;border-radius:13px!important}
      .shop-name{font-size:18px!important}
      .greeting{font-size:8.5px!important}
      .lang-btn{min-width:47px!important;width:47px!important;height:32px!important;font-size:9px!important}
    }
